site_name: PhiJAX
site_description: A JAX framework for physics-informed neural networks.
site_url: https://hangjung97.github.io/PhiJAX/
repo_url: https://github.com/HangJung97/PhiJAX
repo_name: HangJung97/PhiJAX
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - toc.follow
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search
  - mkdocstrings:
      custom_templates: docs_templates
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 2
            inherited_members: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            extra:
              source_repository: https://github.com/HangJung97/PhiJAX
              source_ref: main

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/shortcuts.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/api-reference.css

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Heat-equation quickstart: getting-started/quickstart.md
      - Core concepts: getting-started/concepts.md
      - Migrating from 0.1: getting-started/migration-0.2.md
  - Guides:
      - Build and train:
          - Training and prediction: guides/training.md
          - Custom models: guides/models.md
          - Datasets: guides/datasets.md
          - Equations and objectives: guides/objectives.md
          - Loss balancers: guides/balancers.md
      - Run and debug:
          - Logging and monitoring: guides/logging.md
          - Randomness and reproducibility: guides/reproducibility.md
          - Troubleshooting: guides/troubleshooting.md
  - API reference:
      - Overview: api/index.md
      - Core:
          - Trainer: api/trainer.md
          - PhiModule: api/module.md
          - Data: api/data.md
          - Models:
              - Overview: api/models/index.md
              - MLP: api/models/mlp.md
              - Modified MLP: api/models/modified.md
              - PirateNet: api/models/pirate-net.md
              - Layers: api/models/layers.md
      - Training runtime:
          - State and plans: api/training.md
          - Precision: api/precision.md
          - Device strategies: api/strategies.md
      - Extensions:
          - Hooks and lifecycle: api/hooks.md
          - Callbacks:
              - Overview: api/callbacks/index.md
              - Monitoring: api/callbacks/monitoring.md
              - Display: api/callbacks/display.md
              - Prediction: api/callbacks/prediction.md
          - Checkpointing: api/checkpointing.md
          - Loggers: api/loggers.md
      - Physics and optimization:
          - Derivatives: api/derivatives.md
          - Equations: api/equations.md
          - Objectives: api/objectives.md
          - Loss balancers: api/balancers.md
      - Supporting APIs:
          - Evaluation: api/evaluation.md
          - Configuration: api/configuration.md
          - Utilities: api/utilities.md
  - Changelog: changelog.md
