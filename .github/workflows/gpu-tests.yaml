name: GPU tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main, "release/*", dev]
  workflow_dispatch:

concurrency:
  group: gpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-install:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, nvidia]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        cuda: [cuda12, cuda13]
    env:
      UV_PROJECT_ENVIRONMENT: .venv-${{ matrix.python-version }}-${{ matrix.cuda }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Inspect NVIDIA driver
        run: nvidia-smi
      - name: Install accelerator environment
        run: uv sync --extra ${{ matrix.cuda }}
      - name: Verify JAX GPU execution
        run: >-
          uv run --no-sync python -c
          "import jax; import jax.numpy as jnp; assert jax.default_backend() == 'gpu';
          assert float(jax.jit(lambda x: x + 1)(jnp.asarray(1.0))) == 2.0"

  gpu-workflow:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, nvidia]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.12", "3.14"]
        cuda: [cuda12, cuda13]
    env:
      UV_PROJECT_ENVIRONMENT: .venv-workflow-${{ matrix.python-version }}-${{ matrix.cuda }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install accelerator environment
        run: uv sync --extra ${{ matrix.cuda }}
      - name: Run compiled GPU workflows
        run: uv run --no-sync pytest -m gpu
