[project]
name = "phijax"
version = "0.1.0b1"
description = "A configuration-first JAX framework for training physics-informed neural networks."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hang Jung Ling", email = "hangjung.ling@gmail.com" }]
keywords = ["jax", "physics-informed-neural-networks", "pinn", "scientific-machine-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "colorlog>=6.10,<7",
  "flax==0.12.9",
  "hydra-core==1.3.5",
  "h5py>=3.16,<4",
  "jax==0.11.1",
  "mat73>=0.65,<1",
  "numpy>=2.4,<3",
  "omegaconf==2.3.1",
  "optax==0.2.8",
  "orbax-checkpoint==0.12.4",
  "rich>=15,<16",
  "rootutils>=1.0.7,<2",
  "scipy>=1.17,<2",
]

[project.urls]
Changelog = "https://github.com/HangJung97/PhiJAX/blob/main/CHANGELOG.md"
Documentation = "https://hangjung97.github.io/PhiJAX"
Issues = "https://github.com/HangJung97/PhiJAX/issues"
Repository = "https://github.com/HangJung97/PhiJAX"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.11.1"]
cuda13 = ["jax[cuda13]==0.11.1"]
tensorboard = ["tensorboard>=2.20,<3"]
wandb = ["wandb>=0.29,<0.30"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
all = [{ include-group = "dev" }, { include-group = "docs" }]
dev = [
  "pre-commit>=4.0.1,<5",
  { include-group = "lint" },
  { include-group = "test" },
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9,<10",
  "mkdocstrings[python]>=0.27,<1",
]
lint = ["docformatter>=1.7.5,<2", "pyright>=1.1.405,<2", "ruff>=0.16,<0.17"]
test = ["pytest>=9,<10", "pytest-cov>=7,<8"]

[tool.uv]
required-version = ">=0.12,<0.13"
conflicts = [[{ extra = "cuda12" }, { extra = "cuda13" }]]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
]
filterwarnings = [
  "ignore:.*deprecated.*:DeprecationWarning:orbax.*",
]
log_cli = true
markers = [
  "gpu: tests that require at least one JAX-visible GPU device",
  "slow: slow tests",
]
minversion = "9.0"
testpaths = ["tests"]

[tool.coverage.run]
source = ["phijax"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pyright]
include = ["src/phijax"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "D", "E", "F", "I", "N", "PERF", "PIE", "PT", "RUF", "S", "SIM", "UP", "W"]
ignore = ["ANN401", "D100", "D104", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.docformatter]
recursive = true
wrap-summaries = 120
wrap-descriptions = 120
