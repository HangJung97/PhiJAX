[project]
name = "phijax"
version = "0.1.0"
description = "Physics-informed neural networks for intraventricular vector-flow reconstruction in JAX."
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
  "colorlog>=6.10,<7",
  "h5py>=3.16,<4",
  "hydra-colorlog>=1.2,<2",
  "hydra-core==1.3.2",
  "numpy>=2.4,<3",
  "omegaconf==2.3.0",
  "rich>=15,<16",
  "rootutils>=1.0.7,<2",
  "scipy>=1.17,<2",
]

[project.optional-dependencies]
cpu = [
  "flax==0.12.9",
  "jax==0.11.1",
  "optax==0.2.8",
  "orbax-checkpoint==0.12.4",
]
cuda13 = [
  "flax==0.12.9",
  "jax[cuda13]==0.11.1",
  "optax==0.2.8",
  "orbax-checkpoint==0.12.4",
]
tensorboard = ["tensorboard>=2.20,<3"]

[project.scripts]
phijax-train = "phijax.train:main"
phijax-predict = "phijax.predict:main"
phijax-evaluate-predictions = "phijax.evaluate_predictions:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pre-commit>=4.0.1,<5",
  { include-group = "lint" },
  { include-group = "test" },
]
lint = ["docformatter>=1.7.5,<2", "ruff>=0.16,<0.17"]
test = ["pytest>=9,<10", "pytest-cov>=7,<8"]

[tool.uv]
required-version = ">=0.12,<0.13"
conflicts = [[{ extra = "cpu" }, { extra = "cuda13" }]]

[tool.pytest.ini_options]
addopts = ["--color=yes", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "D", "E", "F", "I", "N", "PERF", "PIE", "PT", "RUF", "S", "SIM", "UP", "W"]
ignore = ["ANN401", "D100", "D104", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.docformatter]
recursive = true
wrap-summaries = 120
wrap-descriptions = 120
